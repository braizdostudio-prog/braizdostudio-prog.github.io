<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Braizdo Studio</title>
<meta name="description" content="Braizdo Studio — independent mobile game studio. Choose your language.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/mark-180.png">
<link rel="apple-touch-icon" href="assets/mark-180.png">
<link rel="alternate" hreflang="fr" href="https://braizdostudio-prog.github.io/fr/">
<link rel="alternate" hreflang="en" href="https://braizdostudio-prog.github.io/en/">
<link rel="alternate" hreflang="de" href="https://braizdostudio-prog.github.io/de/">
<link rel="alternate" hreflang="it" href="https://braizdostudio-prog.github.io/it/">
<link rel="alternate" hreflang="es" href="https://braizdostudio-prog.github.io/es/">
<link rel="alternate" hreflang="pt" href="https://braizdostudio-prog.github.io/pt/">
<link rel="alternate" hreflang="x-default" href="https://braizdostudio-prog.github.io/en/">
<style>
  :root {
    --bg: #000000;
    --card-border: #2a2530;
    --cream: #ede1c9;
    --text: #eae6de;
    --text-dim: #9b968f;
    --flame-3: #ffb648;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
  }
  main {
    text-align: center;
    padding: 24px;
  }
  h1 { color: var(--cream); font-size: 1.4rem; margin: 0 0 20px; }
  ul {
    list-style: none;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0;
    margin: 0;
  }
  a {
    display: inline-block;
    padding: 8px 16px;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
  }
  a:hover { color: var(--flame-3); border-color: var(--flame-3); }
  p.note { color: var(--text-dim); font-size: 0.85rem; margin-top: 22px; }
</style>
<script src="assets/js/lang-redirect.js"></script>
</head>
<body>
<main>
  <h1>Braizdo Studio</h1>
  <ul>
    <li><a href="fr/">Français</a></li>
    <li><a href="en/">English</a></li>
    <li><a href="de/">Deutsch</a></li>
    <li><a href="it/">Italiano</a></li>
    <li><a href="es/">Español</a></li>
    <li><a href="pt/">Português</a></li>
  </ul>
  <p class="note">Redirecting to your language&hellip;</p>
</main>
</body>
</html>
